name: onprem-rag-platform-demo

services:
  business-api-simulator:
    build: ./tools/business-api-simulator
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SIMULATOR_DATABASE_PATH: /app/data/business-api.sqlite3
      SIMULATOR_SEED_DEMO: "true"
    volumes:
      - simulator_data:/app/data
    restart: unless-stopped

volumes:
  simulator_data:
