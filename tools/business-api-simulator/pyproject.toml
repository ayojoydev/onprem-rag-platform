[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-api-simulator"
version = "0.1.0"
description = "Synthetic retail CRUD API for the On-Prem RAG Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
business-api-simulator = "business_api_simulator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
